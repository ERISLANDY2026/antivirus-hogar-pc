# Compilación en la nube de Antivirus Hogar PC (Carril E).
#
# Runner Windows de GitHub Actions: instala Python y dependencias, corre la
# suite de pruebas (headless, sin Qt), compila con PyInstaller usando el
# MISMO .spec del proyecto y empaqueta con Inno Setup usando el MISMO .iss
# que la compilación local. El instalador .exe queda como artefacto del run.
#
# Estado: workflow LISTO y documentado, pero todavía no se ejecuta en
# ninguna cuenta: el proyecto aún no está subido a GitHub (no hay cuenta
# del usuario vinculada). Para activarlo basta con subir el repositorio a
# GitHub; el workflow se dispara a mano (workflow_dispatch) o al publicar
# un tag v*.
name: Construir instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Pruebas (logica pura, sin Qt)
        run: python -m pytest tests/ -q

      - name: Compilar con PyInstaller (--onedir)
        run: pyinstaller packaging/antivirus-hogar-pc.spec --noconfirm

      # Verificación del artefacto CONGELADO (regresión v1.0.0): la suite
      # corre sobre el código fuente y no ve el .exe; en la v1 el
      # ejecutable salió sin los subpaquetes de módulos y la app abría
      # vacía. Aquí se exige que los cuatro registros vayan en el PYZ.
      - name: Verificar módulos dentro del ejecutable
        shell: pwsh
        run: |
          $contenido = pyi-archive_viewer -r dist/AntivirusHogarPC/AntivirusHogarPC.exe | Out-String
          foreach ($m in @("modules.panel.registro", "modules.security.registro", "modules.system.registro", "modules.net.registro")) {
            if ($contenido -notmatch [regex]::Escape($m)) { throw "Falta $m dentro del ejecutable" }
          }
          Write-Host "Los 4 registros de módulos están dentro del ejecutable."

      # El icono espartano de la v1.0.5 debe ir incrustado en el .exe
      # (recurso RT_ICON de 256), no el de por defecto de PyInstaller.
      - name: Verificar el icono dentro del ejecutable
        run: python scripts/verificar_icono.py dist/AntivirusHogarPC/AntivirusHogarPC.exe packaging/icono.ico

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      # SoftEther VPN Client INCORPORADO (v1.0.7): se descarga el
      # instalador oficial vigente del sitio del proyecto, se verifica
      # su tamaño EXACTO contra el listado oficial y se anota su
      # SHA-256 en el registro. Su instalador no tiene modo silencioso
      # fiable, así que se incorporan sus ARCHIVOS (extraídos con
      # 7-Zip, segundo pase sobre el .cab interior) y el .iss registra
      # el servicio SEVPNCLIENT al instalar. Si algo no cuadra, la
      # compilación FALLA: la 1.0.7 no sale sin SoftEther.
      - name: Descargar y preparar SoftEther VPN Client (incorporado)
        shell: pwsh
        run: |
          $url = "https://www.softether-download.com/files/softether/v4.44-9807-rtm-2025.04.16-tree/Windows/SoftEther_VPN_Client/softether-vpnclient-v4.44-9807-rtm-2025.04.16-windows-x86_x64-intel.exe"
          $exe = "softether-oficial.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $f = Get-Item $exe
          Write-Host "SoftEther oficial: $($f.Length) bytes"
          if ($f.Length -ne 56249368) { throw "El instalador de SoftEther no pesa lo que dice el listado oficial (56249368): $($f.Length)" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          Write-Host "SoftEther 4.44-9807 SHA-256: $hash"
          $ErrorActionPreference = "Stop"
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $7z)) { throw "7-Zip no está en el runner" }
          New-Item -ItemType Directory -Force -Path se-extract | Out-Null
          & $7z x $exe -ose-extract -y | Out-Null
          # El instalador oficial es un PE: su carga va como RECURSOS
          # en .rsrc\0\DATAFILE con los nombres internos del fabricante
          # (comprobado en la corrida 45496371062: VPNCLIENT_X64.EXE,
          # VPNCMD_X64.EXE —que es vpncmd—, VPNCMGR_X64.EXE y el núcleo
          # RAW_HAMCORE.SE2). Se copian con el nombre que llevan en una
          # instalación real de SoftEther, que es como la app los busca.
          $datafile = Get-ChildItem -Recurse se-extract -Directory | Where-Object { $_.Name -eq "DATAFILE" } | Select-Object -First 1
          if (-not $datafile) { throw "No apareció la carpeta DATAFILE del instalador oficial" }
          Write-Host "DATAFILE del instalador oficial:"
          Get-ChildItem $datafile.FullName -File | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length))" }
          $destino = "packaging\softether\client"
          New-Item -ItemType Directory -Force -Path $destino | Out-Null
          $mapa = @{
            "VPNCLIENT_X64.EXE" = "vpnclient_x64.exe"
            "VPNCMD_X64.EXE"    = "vpncmd_x64.exe"
            "VPNCMGR_X64.EXE"   = "vpncmgr_x64.exe"
            "RAW_HAMCORE.SE2"   = "hamcore.se2"
          }
          foreach ($k in $mapa.Keys) {
            $src = Join-Path $datafile.FullName $k
            if (-not (Test-Path $src)) { throw "Falta $k en los recursos del instalador oficial" }
            Copy-Item $src (Join-Path $destino $mapa[$k]) -Force
          }
          # Los recursos .exe NO son el PE: van COMPRIMIDOS con el
          # formato del fabricante (prefijo de 4 bytes con el tamaño
          # real + flujo zlib «78 9C»; comprobado en la corrida
          # 45500037110, por eso Windows los rechazaba). El hamcore
          # sí va crudo (de ahí su nombre RAW_). Se descomprimen aquí
          # y se verifica que el tamaño cuadra con el prefijo.
          @'
          import struct, zlib, os, sys
          for nombre in ("vpnclient_x64.exe", "vpncmd_x64.exe", "vpncmgr_x64.exe"):
              ruta = os.path.join("packaging", "softether", "client", nombre)
              datos = open(ruta, "rb").read()
              esperado = struct.unpack("<I", datos[:4])[0]
              assert datos[4:6] == b"\x78\x9c", f"{nombre}: sin cabecera zlib"
              real = zlib.decompress(datos[4:])
              assert len(real) == esperado, f"{nombre}: {len(real)} != {esperado}"
              assert real[:2] == b"MZ", f"{nombre}: no es un PE"
              open(ruta, "wb").write(real)
              print(f"{nombre}: descomprimido a {len(real)} bytes (PE OK)")
          '@ | Set-Content -Path "se-descomprimir.py" -Encoding ascii
          python se-descomprimir.py
          if ($LASTEXITCODE -ne 0) { throw "La descompresión de los .exe de SoftEther falló" }
          # Diagnóstico de formato: cabecera de cada pieza al registro
          # (un PE x64 válido empieza por «MZ», Machine 0x8664; el
          # hamcore lleva su firma «HamCore»).
          foreach ($pieza in @("vpnclient_x64.exe", "vpncmd_x64.exe", "vpncmgr_x64.exe", "hamcore.se2")) {
            $rutaP = Join-Path $destino $pieza
            $b = [System.IO.File]::ReadAllBytes($rutaP)
            $machine = ""
            if ($b.Length -gt 64 -and $b[0] -eq 0x4D -and $b[1] -eq 0x5A) {
              $peOff = [BitConverter]::ToInt32($b, 0x3C)
              if ($peOff -gt 0 -and $peOff + 6 -lt $b.Length) {
                $machine = " Machine=0x{0:X4}" -f [BitConverter]::ToUInt16($b, $peOff + 4)
              }
            }
            Write-Host "$pieza`: $($b.Length) bytes, cabecera: $([BitConverter]::ToString($b[0..15]))$machine"
          }
          # Humo NO bloqueante: se intenta arrancar vpncmd; su salida
          # queda en el registro como evidencia, pero un rechazo del
          # runner (sesión de servicio, políticas) no tumba la
          # compilación: la prueba de verdad es la PC del usuario.
          try {
            $vpncmdExe = (Resolve-Path (Join-Path $destino "vpncmd_x64.exe")).Path
            $smoke = & $vpncmdExe /CLIENT localhost /CMD NicList 2>&1 | Out-String
            Write-Host "vpncmd (humo, código $LASTEXITCODE): $smoke"
          } catch {
            Write-Host "vpncmd (humo) no arrancó en el runner: $($_.Exception.Message)"
          }
          "SoftEther VPN Client 4.44 Build 9807 RTM (2025-04-16)`r`nInstalador oficial: $url`r`nTamano: 56249368 bytes`r`nSHA-256: $hash" | Out-File -FilePath (Join-Path $destino "SOFTETHER-CLIENT.txt") -Encoding ascii
          Write-Host "Archivos del cliente incorporado:"
          Get-ChildItem -Recurse $destino | ForEach-Object { Write-Host "  $($_.FullName.Substring((Resolve-Path $destino).Path.Length)) ($($_.Length))" }

      - name: Crear el instalador con Inno Setup
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\instalador.iss'

      # El instalador FINAL debe llevar SoftEther dentro (v1.0.7): la
      # prueba estructural es el registro de ISCC («Compressing: …
      # softether\client\hamcore.se2» y las demás piezas, ya visto en
      # la corrida 45500037110, que pesó 68.850.364 con la carga aún
      # comprimida); como respaldo, el tamaño: la 1.0.6 pesaba
      # 40.619.617 y con el cliente incorporado debe pasar de 55 MB.
      - name: Verificar que el instalador lleva SoftEther
        shell: pwsh
        run: |
          $inst = Get-Item "dist-instalador\*.exe" | Select-Object -First 1
          Write-Host "Instalador final: $($inst.Name) = $($inst.Length) bytes"
          if ($inst.Length -lt 55000000) { throw "El instalador pesa $($inst.Length): SoftEther no quedó incorporado" }

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-AntivirusHogarPC
          path: dist-instalador/*.exe
          if-no-files-found: error
