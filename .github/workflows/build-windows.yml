# Compilación en la nube de Antivirus Hogar PC (Carril E).
#
# Runner Windows de GitHub Actions: instala Python y dependencias, corre la
# suite de pruebas (headless, sin Qt), compila con PyInstaller usando el
# MISMO .spec del proyecto y empaqueta con Inno Setup usando el MISMO .iss
# que la compilación local. El instalador .exe queda como artefacto del run.
#
# Estado: workflow LISTO y documentado, pero todavía no se ejecuta en
# ninguna cuenta: el proyecto aún no está subido a GitHub (no hay cuenta
# del usuario vinculada). Para activarlo basta con subir el repositorio a
# GitHub; el workflow se dispara a mano (workflow_dispatch) o al publicar
# un tag v*.
name: Construir instalador Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Pruebas (logica pura, sin Qt)
        run: python -m pytest tests/ -q

      - name: Compilar con PyInstaller (--onedir)
        run: pyinstaller packaging/antivirus-hogar-pc.spec --noconfirm

      # Verificación del artefacto CONGELADO (regresión v1.0.0): la suite
      # corre sobre el código fuente y no ve el .exe; en la v1 el
      # ejecutable salió sin los subpaquetes de módulos y la app abría
      # vacía. Aquí se exige que los cuatro registros vayan en el PYZ.
      - name: Verificar módulos dentro del ejecutable
        shell: pwsh
        run: |
          $contenido = pyi-archive_viewer -r dist/AntivirusHogarPC/AntivirusHogarPC.exe | Out-String
          foreach ($m in @("modules.panel.registro", "modules.security.registro", "modules.system.registro", "modules.net.registro")) {
            if ($contenido -notmatch [regex]::Escape($m)) { throw "Falta $m dentro del ejecutable" }
          }
          Write-Host "Los 4 registros de módulos están dentro del ejecutable."

      # El icono espartano de la v1.0.5 debe ir incrustado en el .exe
      # (recurso RT_ICON de 256), no el de por defecto de PyInstaller.
      - name: Verificar el icono dentro del ejecutable
        run: python scripts/verificar_icono.py dist/AntivirusHogarPC/AntivirusHogarPC.exe packaging/icono.ico

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      # OpenVPN Community INCORPORADO (v1.0.10): se descarga el
      # instalador oficial vigente (el MSI amd64 que enlaza la
      # pagina oficial openvpn.net/community-downloads), se
      # verifica su tamano EXACTO y su SHA-256 contra los fijados
      # aqui (tomados del servidor oficial el 2026-11-25) y su
      # firma Authenticode. Si algo no cuadra, la compilacion
      # FALLA: la 1.0.10 no sale sin su OpenVPN verificado.
      # SoftEther ya no se descarga: salio del paquete.
      - name: Descargar y verificar OpenVPN Community (incorporado)
        shell: pwsh
        run: |
          $url = "https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.9-I002-amd64.msi"
          New-Item -ItemType Directory -Force -Path "packaging\openvpn" | Out-Null
          $msi = "packaging\openvpn\OpenVPN-2.7.9-I002-amd64.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          $f = Get-Item $msi
          Write-Host "OpenVPN oficial: $($f.Length) bytes"
          if ($f.Length -ne 5939200) { throw "El instalador de OpenVPN no pesa lo que anuncia el servidor oficial (5939200): $($f.Length)" }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          Write-Host "OpenVPN 2.7.9-I002 SHA-256: $hash"
          if ($hash -ne "D050EFADC6CABC4E304EB810DD7FEDFC54B859D34730AB9CDCB22D61EB86AB7A") { throw "La huella del instalador de OpenVPN no coincide con la oficial fijada: $hash" }
          $sig = Get-AuthenticodeSignature $msi
          Write-Host "Firma Authenticode del MSI: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "La firma del instalador de OpenVPN no es valida: $($sig.Status)" }
          $txt = "OpenVPN Community 2.7.9 (instalador I002, amd64)`r`nInstalador oficial: $url`r`nTamano: 5939200 bytes`r`nSHA-256: $hash`r`n"
          $txt | Out-File -FilePath "packaging\openvpn\OPENVPN-INSTALADOR.txt" -Encoding ascii
          Write-Host "Archivos del paquete OpenVPN incorporado:"
          Get-ChildItem "packaging\openvpn" | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length))" }

      # La verificacion del auto-actualizador de OpenVPN (v1.0.10)
      # se ejercita AQUI contra el instalador oficial REAL recien
      # descargado: verificar_paquete_msi debe aceptar el paquete
      # (tamano + estructura MSI + huella) y firma_authenticode
      # debe dar la firma valida de OpenVPN. Es la misma puerta
      # que la app aplica antes de actualizarse: si el formato
      # cambiara, la compilacion lo caza aqui y no en la PC del
      # usuario.
      - name: Ejercitar la verificacion del auto-actualizador de OpenVPN
        shell: pwsh
        run: |
          @'
          import sys
          sys.path.insert(0, ".")
          from antivirus_hogar_pc.winapi.openvpn_update import (
              verificar_paquete_msi, firma_authenticode)
          ruta = r"packaging\openvpn\OpenVPN-2.7.9-I002-amd64.msi"
          v = verificar_paquete_msi(ruta, 5939200)
          print("Verificacion del paquete:", v)
          assert v["ok"], v
          assert v["sha256"] == "d050efadc6cabc4e304eb810dd7fedfc54b859d34730ab9cdcb22d61eb86ab7a", v
          f = firma_authenticode(ruta)
          print("Firma Authenticode:", f)
          if not f["valida"]:
              # Diagnóstico: la salida cruda de AMBOS métodos.
              from antivirus_hogar_pc.winapi import openvpn_update as ou
              from antivirus_hogar_pc.winapi.powershell import ejecutar_powershell
              for nombre, script in (
                      ("cmdlet", ou._script_firma(ruta)),
                      ("respaldo", ou._script_firma_respaldo(ruta))):
                  try:
                      print("DIAG", nombre, ":",
                            repr(ejecutar_powershell(script, timeout=60)))
                  except Exception as exc:
                      print("DIAG", nombre, "EXC:", repr(exc))
          assert f["valida"], f
          print("Auto-actualizador de OpenVPN OK contra el instalador oficial real")
          '@ | Set-Content -Path "ovpn-probar-verificacion.py" -Encoding ascii
          python ovpn-probar-verificacion.py
          if ($LASTEXITCODE -ne 0) { throw "La verificacion del auto-actualizador de OpenVPN fallo contra el instalador oficial" }

      # v1.0.11: LA PUERTA QUE FALTÓ EN LA 1.0.10. El fallo real
      # en la PC del usuario fue de PARSEO: la ruta de credenciales
      # con barras simples dentro del .ovpn («Bad backslash») mata
      # a openvpn.exe antes de abrir su registro, y la suite no lo
      # vio porque su test EXIGÍA las barras simples. Aquí el
      # openvpn.exe REAL (extraído del MSI oficial por instalación
      # administrativa, sin tocar el sistema) parsea el perfil que
      # genera LA PROPIA APP desde su lista semilla, con la ruta de
      # credenciales en una carpeta CON ESPACIO («NEW USER», como
      # la del usuario). Si la salida trae «Bad backslash»,
      # «Options error» o «Use --help», la compilación FALLA. Lo
      # que NO prueba esta puerta: el túnel (no hay TAP instalada
      # ni se instala nada): basta con que el proceso SUPERE el
      # parseo y llegue a la fase de red/dispositivo.
      - name: Verificar el parseo del perfil con el OpenVPN real (v1.0.11)
        shell: pwsh
        run: |
          $destino = Join-Path $env:RUNNER_TEMP "ovpn-admin"
          Start-Process msiexec -ArgumentList "/a","packaging\openvpn\OpenVPN-2.7.9-I002-amd64.msi","/qn","TARGETDIR=$destino" -Wait -NoNewWindow
          $exe = Get-ChildItem -Recurse -Filter "openvpn.exe" $destino | Select-Object -First 1
          if (-not $exe) { throw "La instalacion administrativa del MSI no dejo openvpn.exe" }
          Write-Host "openvpn.exe real: $($exe.FullName)"
          @'
          import os, sys
          sys.path.insert(0, ".")
          from antivirus_hogar_pc import config
          from antivirus_hogar_pc.core import vpngate
          from antivirus_hogar_pc.winapi.vpn_win import preparar_perfil_vpngate
          servidores, _f = vpngate.leer_semilla_vpngate(config.carpeta_activos())
          assert servidores, "sin semilla no hay perfil que verificar"
          base = os.path.join(os.environ["RUNNER_TEMP"], "NEW USER", "vpn")
          os.makedirs(base, exist_ok=True)
          cred = os.path.join(base, "vpngate-credenciales.txt")
          with open(cred, "w", encoding="utf-8", newline="\n") as f:
              f.write("vpn\nvpn\n")
          perfil = preparar_perfil_vpngate(servidores[0].generar_ovpn(), cred)
          ruta = os.path.join(base, "vpngate-activo.ovpn")
          with open(ruta, "w", encoding="utf-8", newline="\n") as f:
              f.write(perfil)
          print("Perfil generado:", ruta)
          print("auth-user-pass:", [l for l in perfil.splitlines()
                                    if "auth-user-pass" in l])
          '@ | Set-Content -Path "ovpn-generar-perfil.py" -Encoding ascii
          python ovpn-generar-perfil.py
          if ($LASTEXITCODE -ne 0) { throw "No se pudo generar el perfil de prueba" }
          $perfil = Join-Path $env:RUNNER_TEMP "NEW USER\vpn\vpngate-activo.ovpn"
          $salida = Join-Path $env:RUNNER_TEMP "ovpn-parseo.txt"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "--config","`"$perfil`"" -RedirectStandardOutput $salida -RedirectStandardError "$salida.err" -PassThru -NoNewWindow
          Start-Sleep -Seconds 20
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          $texto = (Get-Content $salida -Raw -ErrorAction SilentlyContinue) + (Get-Content "$salida.err" -Raw -ErrorAction SilentlyContinue)
          Write-Host "Salida del OpenVPN real (primeras lineas):"
          ($texto -split "`n" | Select-Object -First 12) | ForEach-Object { Write-Host "  $_" }
          if ($texto -match "Bad backslash|Options error|Use --help") { throw "El perfil generado NO pasa el parseo del OpenVPN real (el fallo de la 1.0.10)" }
          if ($texto -notmatch "TCP|UDP|TLS|TUN|TAP|link local|Attempting|RESOLVE|Connect") { throw "La salida no muestra que el proceso superara el parseo (sin fase de red/dispositivo)" }
          Write-Host "Parseo del perfil OK con el OpenVPN real: el fallo de la 1.0.10 no vuelve."

      - name: Crear el instalador con Inno Setup
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\instalador.iss'

      # El instalador FINAL debe llevar OpenVPN dentro (v1.0.10):
      # sin el paquete, la app pesaba 40.619.617 bytes (1.0.6); con
      # el MSI oficial de OpenVPN (5.939.200) debe pasar de 44 MB.
      # La prueba fuerte del paquete (tamano, huella y firma) ya
      # corrio en el paso de descarga.
      - name: Verificar que el instalador lleva OpenVPN
        shell: pwsh
        run: |
          $inst = Get-Item "dist-instalador\*.exe" | Select-Object -First 1
          Write-Host "Instalador final: $($inst.Name) = $($inst.Length) bytes"
          if ($inst.Length -lt 44000000) { throw "El instalador pesa $($inst.Length): OpenVPN no quedo incorporado" }

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-AntivirusHogarPC
          path: dist-instalador/*.exe
          if-no-files-found: error
